[project]
name = "bowerbird"
version = "0.1.0"
description = "Collects the CVs of applicants to your LinkedIn job posts, one folder per job."
readme = "README.md"
license = "MIT"
authors = [{name = "RubinRazaa"}]
requires-python = ">=3.11"
dependencies = ["playwright"]

[project.scripts]
bowerbird = "bowerbird:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["bowerbird"]
