[project]
name = "bowerbird"
version = "0.1.0"
description = "Collects the CVs of applicants to your LinkedIn job posts, one folder per job."
readme = "README.md"
license = "MIT"
authors = [{name = "RubinRazaa"}]
requires-python = ">=3.11"
dependencies = ["playwright"]
keywords = ["linkedin", "recruiting", "resume", "cv", "playwright"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/RubinRazaa/bowerbird"
Issues = "https://github.com/RubinRazaa/bowerbird/issues"

[project.scripts]
bowerbird = "bowerbird.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
