[project]
name = "linkedin-cvs"
version = "0.1.0"
description = "Download the CVs of applicants to your LinkedIn job posts."
readme = "README.md"
license = "MIT"
authors = [{name = "RubinRazaa"}]
requires-python = ">=3.11"
dependencies = ["playwright"]

[project.scripts]
linkedin-cvs = "linkedin_cvs:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["linkedin_cvs"]
