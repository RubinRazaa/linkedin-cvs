<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" role="img" aria-label="bowerbird">
  <title>bowerbird</title>
  <!-- beak -->
  <path fill="#378FE9" d="M196 92 L230 108 L196 124 Z"/>
  <!-- lowercase b: the stem is the crest, the bowl is the head, the hole is the eye -->
  <path fill="#0A66C2" fill-rule="evenodd" d="
    M116 38 a14 14 0 0 1 28 0 V70 a44 44 0 1 1 -28 38 Z
    M182 100 a11 11 0 1 0 -22 0 a11 11 0 1 0 22 0 Z"/>
  <circle cx="171" cy="100" r="4.5" fill="#0A66C2"/>
  <text x="160" y="226" text-anchor="middle" font-size="52" font-weight="700" letter-spacing="-1"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <tspan fill="#0A66C2">bower</tspan><tspan fill="#378FE9">bird</tspan>
  </text>
</svg>
